# Beast OS: SSH for the tablet's Termux (tunnel + Claude Code in tmux).
# Keys only, this user only. UFW limits it to the LAN and the tailnet.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AllowUsers topsee_crets
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 30
ClientAliveCountMax 4
