<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="mobile-web-app-capable" content="yes">
<title>Beast OS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="brand"><span class="sigil"></span>BEAST<b>OS</b></div>
    <div id="chips"></div>
    <div id="clock-mini"></div>
  </header>

  <main id="views">
    <!-- HOME -->
    <section class="view active" data-view="home">
      <div class="hero">
        <div id="clock">--:--</div>
        <div id="date"></div>
      </div>
      <h2>Modes</h2>
      <div id="scenes" class="scenes"></div>
      <h2>Now Playing</h2>
      <div id="np-home"></div>
      <h2>Sound</h2>
      <div id="mode-home" class="seg"></div>
    </section>

    <!-- MEDIA -->
    <section class="view" data-view="media">
      <h1>Media</h1>
      <div id="media-list"></div>
    </section>

    <!-- AUDIO -->
    <section class="view" data-view="audio">
      <h1>Audio</h1>
      <h2>Output mode · Beast HDMI → Sony</h2>
      <div id="mode-audio" class="seg big"></div>
      <h2>Outputs</h2>
      <div id="sinks"></div>
    </section>

    <!-- ROOMS -->
    <section class="view" data-view="rooms">
      <h1>Rooms</h1>
      <div id="rooms"></div>
    </section>

    <!-- CAMS -->
    <section class="view" data-view="cams">
      <h1>Cameras</h1>
      <div id="cams" class="cams"></div>
    </section>

    <!-- HERMES -->
    <section class="view" data-view="hermes">
      <h1>Hermes</h1>
      <div id="chat"></div>
      <form id="ask">
        <input id="ask-text" autocomplete="off" placeholder="Ask Hermes…">
        <button type="button" id="mic" aria-label="Hold to talk"></button>
      </form>
    </section>
  </main>

  <nav id="dock"></nav>
  <div id="toast"></div>
  <div id="offline"><div><span class="sigil big"></span><p>BEAST UNREACHABLE</p><small>Reconnecting…</small></div></div>
</div>
<script src="app.js"></script>
</body>
</html>
