<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beast OS Visuals</title>
<style>
  :root {
    --bg: #050607;
    --ink: #d8e6d8;
    --dim: #6f7d72;
    --accent: #32cd32;
    --panel: rgba(10, 14, 12, 0.72);
    --line: rgba(120, 255, 140, 0.16);
    --mood-a: #0b1a14;
    --mood-b: #050607;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: 'JetBrains Mono', 'DejaVu Sans Mono', monospace; overflow: hidden; }
  body { background: radial-gradient(ellipse at 50% 45%, var(--mood-a) 0%, var(--mood-b) 70%); transition: background 1.2s; }
  #brain { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* ---- overlay layout --------------------------------------------------
     One flowing column (top bar / middle row / controls bar) on top of the
     full-bleed canvas, instead of pieces pinned at fixed pixel offsets. The
     pieces can no longer sit on top of each other, whatever size the frame is
     (desktop, half-width window, the 7" tablet). */
  #ui { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 8px; padding: 10px 12px;
    pointer-events: none; min-height: 0; }
  #top { flex: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .tag { font-size: 11px; letter-spacing: .18em; color: var(--dim); }
  .tag b { color: var(--accent); font-weight: 600; }
  #layers { display: flex; gap: 6px; pointer-events: auto; }
  #layers button { font: inherit; font-size: 12px; letter-spacing: .12em; color: var(--dim); background: rgba(255,255,255,.04);
    border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  #layers button.on { color: var(--accent); border-color: var(--accent); background: rgba(50,205,50,.1); }
  #state { font-size: 12px; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; white-space: nowrap; }
  #mid { flex: 1 1 auto; min-height: 0; display: flex; align-items: flex-end; gap: 12px; }
  #blobcol { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; pointer-events: auto; }
  #blobwrap { position: relative; width: clamp(88px, min(26vh, 22vw), 240px); aspect-ratio: 1; }
  #blob, #sat { position: absolute; inset: 0; width: 100%; height: 100%; }
  #sat { pointer-events: none; }
  .lbl { font-size: 10px; letter-spacing: .2em; color: var(--dim); }
  #reply { flex: 1 1 auto; min-width: 0; align-self: flex-end; text-align: center; font-size: 13px; line-height: 1.5; color: var(--ink);
    text-shadow: 0 0 12px rgba(0,0,0,.9); min-height: 1.5em; padding: 0 4px 4px; }
  #info { flex: 0 1 300px; min-width: 0; align-self: flex-start; margin-left: auto; max-height: 100%; overflow: auto; padding: 12px 14px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--panel); font-size: 12px; line-height: 1.5; display: none;
    backdrop-filter: blur(6px); pointer-events: auto; }
  #info h3 { margin: 0 0 4px; font-size: 13px; color: var(--accent); letter-spacing: .08em; }
  #info .k { color: var(--dim); }
  #hud { flex: none; pointer-events: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); backdrop-filter: blur(6px); }
  #hud button, #hud input[type=text] { font: inherit; font-size: 12px; color: var(--ink); background: rgba(255,255,255,.04);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; cursor: pointer; }
  #hud button:hover { border-color: var(--accent); color: var(--accent); }
  #hud input[type=text] { flex: 1 1 160px; min-width: 100px; cursor: text; }
  #hud .grp { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; min-width: 0; }
  #hud #askgrp { flex: 1 1 320px; }
  #hud label { font-size: 10px; letter-spacing: .12em; color: var(--dim); display: flex; align-items: center; gap: 4px; }
  #hud input[type=range] { width: clamp(52px, 6vw, 90px); accent-color: var(--accent); }
  #b-mood { display: none; }
  .sep { width: 1px; height: 24px; background: var(--line); }
  /* The ask / Hey Virge / desk-light row is retired from this page (Virgil's talk window is the VIRGIL bar at the
     bottom of Beast OS). What's left is the mood check-in, which tucks itself away once you've checked in. */
  #askgrp, .sep { display: none !important; }
  #hud.hidden { display: none; }
  #moodpill { display: none; position: fixed; right: 14px; bottom: 12px; pointer-events: auto; font: inherit; font-size: 12px; letter-spacing: .12em;
    color: var(--dim); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; backdrop-filter: blur(6px); }
  #moodpill:hover { color: var(--accent); border-color: var(--accent); }
  @media (max-height: 640px), (max-width: 900px) {
    #info { flex-basis: 220px; }
    .tag { font-size: 10px; letter-spacing: .12em; }
  }
  @media (max-height: 440px) { .lbl { display: none; } #reply { font-size: 12px; } }
  /* ?view=mood : the glowing mood blob on its own, big and centred, no map behind it. */
  body.moodonly #brain, body.moodonly #b-mood, body.moodonly #info, body.moodonly .sep { display: none !important; }
  body.moodonly #mid { flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
  body.moodonly #blobwrap { width: clamp(160px, min(58vh, 70vw), 560px); }
  body.moodonly #reply { flex: none; align-self: center; max-width: min(640px, 92vw); font-size: 15px; }
  body.moodonly #moodgrp { display: flex !important; flex: 1 1 100%; justify-content: center; }
</style>
</head>
<body>
<canvas id="brain"></canvas>
<button id="moodpill" type="button">◐ MOOD CHECK-IN</button>
<div id="ui">
  <div id="top">
    <div class="tag"><b>BEAST OS</b> · <span id="tagname">SECOND BRAIN · sample graph, not wired yet</span></div>
    <div id="layers"><button data-l="virgil">VIRGIL</button><button data-l="me">ME</button><button data-l="both" class="on">BOTH</button></div>
    <div id="state">idle</div>
  </div>
  <div id="mid">
    <div id="blobcol"><div id="blobwrap"><canvas id="blob"></canvas><canvas id="sat"></canvas></div><div class="lbl">MOOD</div></div>
    <div id="reply"></div>
    <div id="info"></div>
  </div>
  <div id="hud">
    <div class="grp" id="askgrp">
      <button id="b-listen" title="Push to talk (uses your mic level)">◉ Hey Virge</button>
      <input id="ask" type="text" placeholder="Ask Virgil… (prototype answer)" autocomplete="off">
      <button id="b-act" title="Fire an action at Home Assistant">⚡ Desk light</button>
      <button id="b-mood" type="button" title="Show the mood sliders">◐ Mood</button>
    </div>
    <span class="sep"></span>
    <div class="grp" id="moodgrp">
      <label>MOOD <input id="m-temper" type="range" min="0" max="10" step="0.1" value="6"></label>
      <label>VITALITY <input id="m-vital" type="range" min="0" max="10" step="0.1" value="5"></label>
      <label>RECOVERY <input id="m-recov" type="range" min="0" max="10" step="0.1" value="7"></label>
      <label>STREAK <input id="m-streak" type="range" min="0" max="30" step="1" value="9"></label>
      <button id="b-check">✓ Check in</button>
    </div>
  </div>
</div>

<script>
function beastVisuals(REAL) {
  'use strict';

  var LITE = /[?&]lite\b/.test(location.search);
  var DPR = Math.min(window.devicePixelRatio || 1, LITE ? 1 : 1.5);
  var $ = function (id) { return document.getElementById(id); };

  // ------------------------------------------------------------------
  // Colour helpers
  // ------------------------------------------------------------------
  function hue2rgb(h) {
    var r = Math.abs(((h * 6 + 0) % 6) - 3) - 1;
    var g = Math.abs(((h * 6 + 4) % 6) - 3) - 1;
    var b = Math.abs(((h * 6 + 2) % 6) - 3) - 1;
    return [Math.min(1, Math.max(0, r)), Math.min(1, Math.max(0, g)), Math.min(1, Math.max(0, b))];
  }
  function rgbCss(c, a) {
    return 'rgba(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ',' + a + ')';
  }
  // mood 0..10 -> hue: low = blue/violet, high = gold/lime
  function moodHue(m) { return 0.70 + (0.22 - 0.70) * (m / 10); }

  // ------------------------------------------------------------------
  // The graph: Beast OS modules (live from the kernel), your projects, machines,
  // ventures and real mood check-ins. Notes and tangent links arrive with
  // Virgil's memory.
  // ------------------------------------------------------------------
  var CL = {
    core:  { hue: 0.48, anchor: [0, 0, 0] },
    mod:   { hue: 0.33 }, proj: { hue: 0.07 }, mach: { hue: 0.57 },
    abyss: { hue: 0.76 }, mood: { hue: 0.92 }, vent: { hue: 0.13 }
  };
  var nodes = [], edges = [], byName = {};
  function add(label, cl, size, kind) {
    var n = { i: nodes.length, label: label, cl: cl, size: size || 1, kind: kind || cl, glow: 0, src: 0 };
    nodes.push(n); byName[label] = n.i; return n.i;
  }
  function link(a, b, type) {
    a = typeof a === 'string' ? byName[a] : a; b = typeof b === 'string' ? byName[b] : b;
    if (a === undefined || b === undefined || a === b) return;
    edges.push({ a: a, b: b, t: type || 'link' });
  }
  add('VIRGIL', 'core', 3.2, 'assistant');
  var live = {};
  (REAL.modules || []).forEach(function (m) { live[m.title] = 1; });
  var MODS = ['Arena', 'Ledger', 'Oracle', 'Sanctum', 'Node', 'Overview', 'Mood', 'Second Brain', 'Beast Controls',
              'War Room', 'Home Assistant', 'Jellyfin', 'Abyss', 'KDE Connect', 'Prompts'];
  (REAL.modules || []).forEach(function (m) { if (MODS.indexOf(m.title) < 0) MODS.push(m.title); });
  var BUILT = { Arena: 1, Ledger: 1, Oracle: 1, Sanctum: 1, Node: 1, Overview: 1 };
  MODS.forEach(function (m) {
    var on = BUILT[m] || live[m] || !REAL.live;
    var id = add(m, 'mod', on ? 1.7 : 1.0, on ? 'module · live' : 'module · coming');
    if (!on) nodes[id].dim = 1;
    link('VIRGIL', m);
  });
  link('Beast Controls', 'Overview'); link('Second Brain', 'VIRGIL'); link('Mood', 'Sanctum');
  ['Beast', 'the Event', 'Tablet', 'Phone'].forEach(function (m) { add(m, 'mach', 1.6, 'machine'); link('VIRGIL', m); });
  link('Beast', 'Overview'); link('the Event', 'Home Assistant'); link('the Event', 'Jellyfin');
  link('Tablet', 'Overview'); link('Phone', 'KDE Connect');
  ['Digital products', 'Test & Tag', 'Tech deals'].forEach(function (v) { add(v, 'vent', 1.4, 'venture'); link(v, 'Arena'); link(v, 'Ledger'); });
  link('Ledger', 'Oracle'); link('Arena', 'Oracle');
  var projects = {
    'War Room': 'War Room', 'You-BEAST': 'Jellyfin', 'BeastVision': 'Overview', 'Beasts Playground': 'Abyss',
    'Frame Grabber': 'Abyss', 'HushGame': 'Jellyfin', 'Tablet deck': 'Overview', 'Test & Tag app': 'Test & Tag',
    'Character Builder': 'Abyss', 'Lodge': 'VIRGIL', 'Wattle': 'Tech deals', 'SVG Studio': 'Abyss',
    'Vector Rigs': 'Abyss', 'Welding Wizard': 'Digital products', 'Router Playbook': 'Node'
  };
  Object.keys(projects).forEach(function (p) {
    var id = add(p === 'War Room' ? 'War Room (panel)' : p, 'proj', 1.3, 'project');
    link(id, projects[p]);
  });
  ['Pictures', 'Music', 'Videos', 'Documents', 'Desktop'].forEach(function (f) { add(f + ' · Abyss', 'abyss', 1.2, 'vault'); link('Abyss', f + ' · Abyss'); });
  add('Blender (Abyss)', 'abyss', 1.1, 'app'); link('Blender (Abyss)', 'Videos · Abyss'); link('Blender (Abyss)', 'Desktop · Abyss');
  link('Frame Grabber', 'Pictures · Abyss'); link('You-BEAST', 'Music · Abyss');
  // Two minds: Virgil's (him, his modules, the machines he runs) and mine (projects, ventures, vault, mood).
  var VIRGIL_CL = { core: 1, mod: 1, mach: 1 };
  var layerMode = 'both';
  function setLayer(mode) {
    layerMode = mode;
    nodes.forEach(function (n) { n.layer = VIRGIL_CL[n.cl] ? 'virgil' : 'me'; n.off = mode !== 'both' && n.layer !== mode && n.i !== 0; });
    Array.prototype.forEach.call(document.querySelectorAll('#layers button'), function (b) { b.classList.toggle('on', b.getAttribute('data-l') === mode); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#layers button'), function (b) { b.onclick = function () { setLayer(b.getAttribute('data-l')); }; });
  var prevMood = null;
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  var realChecks = (REAL.mood && REAL.mood.checkins) || [];
  realChecks.slice(-14).forEach(function (c) {
    var id = add('Check-in ' + new Date(c.ts * 1000).toLocaleDateString() + ' · mood ' + c.temper, 'mood', 0.75, 'check-in');
    link(id, prevMood === null ? 'Mood' : prevMood); prevMood = id;
  });
  if (prevMood !== null) link(prevMood, 'Mood');
  setLayer('both');
  var N = nodes.length, E = edges.length;
  var adj = nodes.map(function () { return []; });
  edges.forEach(function (e) { adj[e.a].push(e.b); adj[e.b].push(e.a); });

  // cluster anchors spread on a sphere
  var clKeys = ['mod', 'proj', 'mach', 'abyss', 'mood', 'vent'];
  clKeys.forEach(function (k, i) {
    var phi = Math.acos(1 - 2 * (i + 0.5) / clKeys.length), th = Math.PI * (1 + Math.sqrt(5)) * i;
    CL[k].anchor = [Math.cos(th) * Math.sin(phi) * 70, Math.cos(phi) * 50, Math.sin(th) * Math.sin(phi) * 70];
  });
  nodes.forEach(function (n) { n.rgb = hue2rgb(CL[n.cl].hue); });

  // ------------------------------------------------------------------
  // Force layout in a Web Worker (UI never stutters)
  // ------------------------------------------------------------------
  var pos = new Float32Array(N * 3);
  var workerSrc = '(' + function () {
    var P, V, ed, an, n, alpha = 1;
    onmessage = function (m) {
      var d = m.data; n = d.n; ed = d.edges; an = d.anchors;
      P = new Float32Array(d.init); V = new Float32Array(n * 3);
      for (var w = 0; w < 160; w++) tick();
      loop();
    };
    function tick() {
      var i, j, k;
      for (i = 0; i < n; i++) {
        var ix = i * 3;
        for (j = i + 1; j < n; j++) {
          var jx = j * 3, dx = P[ix] - P[jx], dy = P[ix + 1] - P[jx + 1], dz = P[ix + 2] - P[jx + 2];
          var d2 = dx * dx + dy * dy + dz * dz + 0.5;
          if (d2 > 6400) continue;
          var f = 22 / d2;
          V[ix] += dx * f; V[ix + 1] += dy * f; V[ix + 2] += dz * f;
          V[jx] -= dx * f; V[jx + 1] -= dy * f; V[jx + 2] -= dz * f;
        }
      }
      for (k = 0; k < ed.length; k += 3) {
        var a = ed[k] * 3, b = ed[k + 1] * 3, rest = ed[k + 2] ? 26 : 9, ks = ed[k + 2] ? 0.003 : 0.035;
        var ex = P[b] - P[a], ey = P[b + 1] - P[a + 1], ez = P[b + 2] - P[a + 2];
        var len = Math.sqrt(ex * ex + ey * ey + ez * ez) + 1e-3, s = (len - rest) / len * ks;
        V[a] += ex * s; V[a + 1] += ey * s; V[a + 2] += ez * s;
        V[b] -= ex * s; V[b + 1] -= ey * s; V[b + 2] -= ez * s;
      }
      for (i = 1; i < n; i++) {
        var ix2 = i * 3, A = an[i];
        V[ix2] += (A[0] - P[ix2]) * 0.007; V[ix2 + 1] += (A[1] - P[ix2 + 1]) * 0.007; V[ix2 + 2] += (A[2] - P[ix2 + 2]) * 0.007;
        V[ix2] *= 0.82; V[ix2 + 1] *= 0.82; V[ix2 + 2] *= 0.82;
        P[ix2] += V[ix2] * alpha; P[ix2 + 1] += V[ix2 + 1] * alpha; P[ix2 + 2] += V[ix2 + 2] * alpha;
      }
      P[0] = P[1] = P[2] = 0;
      alpha = Math.max(0.03, alpha * 0.99);
    }
    function loop() {
      tick();
      postMessage(P);
      setTimeout(loop, alpha > 0.05 ? 33 : 120);
    }
  } + ')()';
  var worker = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: 'text/javascript' })));
  var edgeFlat = [];
  edges.forEach(function (e) { edgeFlat.push(e.a, e.b, e.t === 'tangent' ? 1 : 0); });
  worker.onmessage = function (m) { pos.set(m.data); };
  nodes.forEach(function (n, i) {
    var A = CL[n.cl].anchor, j = i ? 22 : 0;
    pos[i * 3] = A[0] + (rnd() - 0.5) * j; pos[i * 3 + 1] = A[1] + (rnd() - 0.5) * j; pos[i * 3 + 2] = A[2] + (rnd() - 0.5) * j;
  });
  worker.postMessage({ n: N, edges: edgeFlat, init: pos, anchors: nodes.map(function (n) { return CL[n.cl].anchor; }) });

  // ------------------------------------------------------------------
  // Shared state: camera, Virgil state machine, mood
  // ------------------------------------------------------------------
  var cam = { yaw: 0.4, pitch: -0.25, dist: 300, autospin: 1 };
  var V = { state: 'idle', level: 0, ring: 0, think: 0, speak: 0, act: 0, t0: 0 };
  var mood = { temper: 6, vital: 5, recov: 7, streak: 9 };
  var moodNow = { hue: moodHue(6), wob: 0.5, smooth: 0.7, size: 0.85 };
  var moodVel = { hue: 0, wob: 0, smooth: 0, size: 0 };
  var pulses = [];
  var lastInteract = performance.now();
  var micAnalyser = null, micBuf = null;

  function setState(s) {
    V.state = s; V.t0 = performance.now();
    $('state').textContent = s === 'idle' ? 'idle' : s + ' …';
  }

  function moodTarget() {
    return {
      hue: moodHue(mood.temper),
      wob: mood.vital / 10,
      smooth: mood.recov / 10,
      size: 0.7 + Math.min(mood.streak, 30) / 30 * 0.35
    };
  }
  function applyAmbient() {
    var c = hue2rgb(moodNow.hue);
    document.documentElement.style.setProperty('--mood-a', rgbCss([c[0] * 0.14, c[1] * 0.14, c[2] * 0.14], 1));
  }

  // ------------------------------------------------------------------
  // Projection (shared by renderers + picking)
  // ------------------------------------------------------------------
  var W = 1, H = 1;
  function project(x, y, z, out) {
    var cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cx = Math.cos(cam.pitch), sx = Math.sin(cam.pitch);
    var x1 = cy * x + sy * z, z1 = -sy * x + cy * z;
    var y2 = cx * y - sx * z1, z2 = sx * y + cx * z1;
    var depth = cam.dist - z2;
    var f = Math.min(W, H) * 1.25 / depth;
    out[0] = W / 2 + x1 * f; out[1] = H / 2 - y2 * f; out[2] = depth; out[3] = f;
    return out;
  }

  // ------------------------------------------------------------------
  // Virgil behaviours
  // ------------------------------------------------------------------
  function firePulse(from, to, delay, hue, onArrive) {
    pulses.push({ a: from, b: to, start: performance.now() + (delay || 0), dur: 520, hue: hue, cb: onArrive });
  }
  function retrievalPath(query) {
    // prototype: walk the graph from a node whose label matches the query, else a hub
    var words = (query || '').toLowerCase().split(/[^a-z0-9&]+/).filter(function (w) { return w.length > 3; });
    var startN = -1;
    for (var i = 1; i < N && startN < 0; i++) {
      var lab = nodes[i].label.toLowerCase();
      for (var w = 0; w < words.length; w++) if (lab.indexOf(words[w]) >= 0) { startN = i; break; }
    }
    if (startN < 0) startN = byName['Arena'];
    var path = [0], seen = {}; seen[0] = 1;
    var cur = startN; path.push(cur); seen[cur] = 1;
    for (var s = 0; s < 5; s++) {
      var nb = adj[cur].filter(function (x) { return !seen[x]; });
      if (!nb.length) break;
      cur = nb[Math.floor(Math.random() * nb.length)]; path.push(cur); seen[cur] = 1;
    }
    return path;
  }
  var REPLIES = [
    'Sample mode: open this inside Beast OS for live answers.',
    'Found it across your projects and the Ledger. The real answer lands when Hermes is live.',
    'Here is what your second brain links to that. Prototype voice only for now.'
  ];
  var pendingReply = null;
  function ask(text) {
    if (!text) return;
    lastInteract = performance.now();
    setState('thinking');
    $('reply').textContent = '';
    nodes.forEach(function (n) { n.src = 0; });
    pendingReply = null;
    var answered = REAL.live ? fetch('/api/action', { method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'hermes', text: text }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { return j.ok ? j.reply : 'Hermes is not running yet. Ollama gets installed next.'; })
      .catch(function () { return 'Hermes is not running yet. Ollama gets installed next.'; })
      : Promise.resolve(REPLIES[Math.floor(Math.random() * REPLIES.length)]);
    var path = retrievalPath(text), step = 0;
    function next() {
      if (step >= path.length - 1) { answered.then(function (msg) { pendingReply = msg; speak(); }); return; }
      var a = path[step], b = path[step + 1]; step++;
      firePulse(a, b, 0, 0.48, function () { nodes[b].glow = 1.4; nodes[b].src = 1; next(); });
    }
    next();
  }
  function speak() {
    setState('speaking');
    var msg = pendingReply || REPLIES[0], i = 0;
    var typer = setInterval(function () {
      i += 2; $('reply').textContent = msg.slice(0, i);
      if (i >= msg.length) { clearInterval(typer); setTimeout(function () { setState('idle'); nodes.forEach(function (n) { n.src = 0; }); }, 1400); }
    }, 38);
  }
  function act(targetLabel) {
    lastInteract = performance.now();
    setState('acting');
    var t = byName[targetLabel];
    var hop = byName['the Event'];
    firePulse(0, hop, 0, 0.13, function () {
      nodes[hop].glow = 1;
      firePulse(hop, t, 0, 0.13, function () {
        nodes[t].glow = 2.2;
        $('reply').textContent = 'Desk light on. (Demo; Home Assistant gets wired in the kernel.)';

      ' vec3 col=base*(0.18+dif*0.45)+film*(0.25+fres*0.9)*0.7+base*sss+vec3(1.0)*spec*0.9;\n' +
      ' o=vec4(col,1.0); }');
    var buf = gl.createBuffer(), vao = gl.createVertexArray();

    return function draw(now, poke, ripple) {

      gl.uniform1f(prog.u.u_wob, moodNow.wob);
      gl.uniform1f(prog.u.u_smooth, moodNow.smooth);
      gl.uniform1f(prog.u.u_size, moodNow.size);
      gl.uniform1f(prog.u.u_ripple, ripple);

    };
  }

  // ------------------------------------------------------------------
  // Lite renderers (Canvas2D) for the tablet's old WebView
  // ------------------------------------------------------------------
  function sprite(c) {
    var s = document.createElement('canvas'); s.width = s.height = 64;
    var x = s.getContext('2d'), g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(0.18, rgbCss(c, 0.9)); g.addColorStop(1, rgbCss(c, 0));
    x.fillStyle = g; x.fillRect(0, 0, 64, 64); return s;
  }
  function BrainLite(canvas) {
    var ctx = canvas.getContext('2d'), sprites = {}, tmp = [0, 0, 0, 0];
    Object.keys(CL).forEach(function (k) { sprites[k] = sprite(hue2rgb(CL[k].hue)); });
    var white = sprite([1, 1, 1]);
    var shown = nodes.filter(function (n) { return n.kind !== 'note' || n.i % 3 === 0; }).map(function (n) { return n.i; });
    return function draw(now, w, h) {
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineWidth = 1;
      for (var k = 0; k < E; k++) {
        var e = edges[k]; if (e.t === 'tangent') continue;
        var A = project(pos[e.a * 3], pos[e.a * 3 + 1], pos[e.a * 3 + 2], [0, 0, 0, 0]);
        var B = project(pos[e.b * 3], pos[e.b * 3 + 1], pos[e.b * 3 + 2], tmp);
        ctx.strokeStyle = rgbCss(nodes[e.a].rgb, 0.12 + (nodes[e.a].src && nodes[e.b].src ? 0.4 : 0));
        ctx.beginPath(); ctx.moveTo(A[0], A[1]); ctx.lineTo(B[0], B[1]); ctx.stroke();
      }
      shown.forEach(function (i) {
        if (!i) return;
        var n = nodes[i], P = project(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2], tmp);
        var s = n.size * P[3] * 16 * (1 + n.glow * 0.8 + (n.src ? 0.6 : 0));
        ctx.globalAlpha = n.off ? 0.08 : Math.min(1, 0.55 + n.glow * 0.5);
        ctx.drawImage(sprites[n.cl], P[0] - s / 2, P[1] - s / 2, s, s);
      });
      pulses.forEach(function (pl) {
        var u = (now - pl.start) / pl.dur; if (u < 0 || u > 1) return;
        var a3 = pl.a * 3, b3 = pl.b * 3;
        var P = project(pos[a3] + (pos[b3] - pos[a3]) * u, pos[a3 + 1] + (pos[b3 + 1] - pos[a3 + 1]) * u, pos[a3 + 2] + (pos[b3 + 2] - pos[a3 + 2]) * u, tmp);
        ctx.globalAlpha = 1; ctx.drawImage(white, P[0] - 10, P[1] - 10, 20, 20);
      });
      // core orb
      var R = Math.min(w, h) * 0.08 * (1 + V.speak * 0.25 + 0.04 * Math.sin(now / 800));
      var c = hue2rgb(0.48), g = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, R * 2.4);
      g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.3, rgbCss(c, 0.8)); g.addColorStop(1, rgbCss(c, 0));
      ctx.globalAlpha = 1; ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w / 2, h / 2, R * 2.4, 0, 6.283); ctx.fill();
      if (V.ring > 0.05) {
        ctx.strokeStyle = rgbCss(c, 0.8 * V.ring); ctx.lineWidth = 2; ctx.beginPath();
        for (var a = 0; a <= 64; a++) {
          var ang = a / 64 * 6.283, rr = R * 1.9 * (1 + 0.08 * V.level * Math.sin(ang * 7 + now / 200));
          ctx[a ? 'lineTo' : 'moveTo'](w / 2 + Math.cos(ang) * rr, h / 2 + Math.sin(ang) * rr);

  }
  function BlobLite(canvas) {
    var ctx = canvas.getContext('2d');
    return function draw(now, poke, ripple) {
      var w = canvas.width, h = canvas.height, cx = w / 2, cy = h / 2;
      ctx.clearRect(0, 0, w, h);
      var R = w * 0.3 * moodNow.size, c = hue2rgb(moodNow.hue), t = now / 1000 * (0.3 + moodNow.wob);
      ctx.beginPath();
      for (var i = 0; i <= 72; i++) {
        var a = i / 72 * 6.283;
        var n = Math.sin(a * 3 + t) * 0.5 + Math.sin(a * 5 - t * 1.3) * 0.3 + Math.sin(a * 11 + t * 2) * (1 - moodNow.smooth) * 0.6;
        var r = R * (1 + n * (0.05 + moodNow.wob * 0.08) + ripple * 0.05 * Math.sin(a * 9 - t * 8));
        ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(a) * r, cy + Math.sin(a) * r);
      }
      var g = ctx.createRadialGradient(cx - R * 0.3, cy - R * 0.4, R * 0.1, cx, cy, R * 1.2);
      g.addColorStop(0, 'rgba(255,255,255,0.9)'); g.addColorStop(0.35, rgbCss(c, 0.95)); g.addColorStop(1, rgbCss([c[0] * 0.3, c[1] * 0.3, c[2] * 0.3], 1));
      ctx.fillStyle = g; ctx.shadowColor = rgbCss(c, 0.8); ctx.shadowBlur = 24; ctx.fill(); ctx.shadowBlur = 0;
    };
  }

  // ------------------------------------------------------------------
  // Satellites: the last 30 check-ins orbiting the blob (2D overlay)
  // ------------------------------------------------------------------
  var history = [];
  if (REAL.live) {
    var byDay = {};
    realChecks.forEach(function (c) { byDay[new Date(c.ts * 1000).toDateString()] = c; });
    Object.keys(byDay).forEach(function (k) {
      var c = byDay[k];
      history.push({ temper: c.temper, note: new Date(c.ts * 1000).toLocaleString() + (c.words ? ' · ' + c.words : '') });
    });
    history = history.slice(-30);
    var last = realChecks[realChecks.length - 1];
    if (last) { mood.temper = last.temper; mood.vital = last.vitality; mood.recov = last.recovery; }
    mood.streak = (REAL.mood && REAL.mood.streak) || 0;
    $('m-temper').value = mood.temper; $('m-vital').value = mood.vital; $('m-recov').value = mood.recov;
    $('m-streak').value = mood.streak; $('m-streak').disabled = true;
    $('m-streak').title = 'Streak counts days in a row with a check-in';
    document.querySelector('.tag').innerHTML = '<b>BEAST OS</b> · SECOND BRAIN · live modules &amp; check-ins';
  } else {
    for (var hd = 29; hd >= 0; hd--) {
      var m0 = 5 + 3 * Math.sin(hd / 4) + (rnd() - 0.5) * 2;
      history.push({ day: hd, temper: Math.max(0, Math.min(10, m0)), note: hd + ' days ago · sample' });
    }
  }
  var satCanvas = $('sat'), satCtx = satCanvas.getContext('2d'), satHit = [];
  function drawSats(now) {
    var w = satCanvas.width, h = satCanvas.height, cx = w / 2, cy = h / 2;
    satCtx.clearRect(0, 0, w, h); satHit = [];
    var R = w * 0.43;
    history.forEach(function (d, i) {
      var a = i / history.length * 6.283 + now / 1000 * 0.06;
      var r = R * (0.92 + 0.06 * Math.sin(now / 1500 + i));
      var x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r * 0.82;
      var c = hue2rgb(moodHue(d.temper)), s = (i === history.length - 1 ? 5 : 2.6) * DPR;
      var g = satCtx.createRadialGradient(x, y, 0, x, y, s * 2.6);
      g.addColorStop(0, 'rgba(255,255,255,0.95)'); g.addColorStop(0.35, rgbCss(c, 0.9)); g.addColorStop(1, rgbCss(c, 0));
      satCtx.fillStyle = g; satCtx.beginPath(); satCtx.arc(x, y, s * 2.6, 0, 6.283); satCtx.fill();
      satHit.push({ x: x / DPR, y: y / DPR, d: d });
    });
  }

  // ------------------------------------------------------------------
  // Boot: sizing, renderers, input
  // ------------------------------------------------------------------
  var brainCanvas = $('brain'), blobCanvas = $('blob');
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    brainCanvas.width = Math.round(W * DPR); brainCanvas.height = Math.round(H * DPR);
    var bw = $('blobwrap').clientWidth;
    var blobScale = LITE ? 1 : Math.min(DPR, 1.25);
    blobCanvas.width = blobCanvas.height = Math.round(bw * blobScale);
    satCanvas.width = satCanvas.height = Math.round(bw * DPR);
  }
  window.addEventListener('resize', resize); resize();
  if (window.ResizeObserver) new ResizeObserver(resize).observe($('blobwrap'));   // blob re-sizes when the layout reflows
  function showHud(on) { $('hud').classList.toggle('hidden', !on); $('moodpill').style.display = on ? 'none' : 'block'; }
  $('moodpill').onclick = function () { showHud(true); };

  var drawBrain = null, drawBlob = null;
  if (!LITE) {
    try { drawBrain = BrainGL(brainCanvas); } catch (e) { console.warn('brain GL failed', e); drawBrain = null; }
    try { drawBlob = BlobGL(blobCanvas); } catch (e) { console.warn('blob GL failed', e); drawBlob = null; }
  }
  if (!drawBrain) { LITE = true; drawBrain = BrainLite(brainCanvas); }
  if (!drawBlob) drawBlob = BlobLite(blobCanvas);
  var MOODONLY = /[?&]view=mood\b/.test(location.search);
  if (MOODONLY) {
    document.body.classList.add('moodonly');
    $('tagname').textContent = 'MOOD';
    drawBrain = function () {};          // no map behind the blob: nothing to draw, nothing to pay for
    resize();
  }
  if (LITE) $('state').textContent = 'idle · lite';

  // orbit / zoom / pick
  var drag = null, pinch = null;
  brainCanvas.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, moved: 0, yaw: cam.yaw, pitch: cam.pitch };
    brainCanvas.setPointerCapture(e.pointerId); lastInteract = performance.now(); cam.autospin = 0;
  });
  brainCanvas.addEventListener('pointermove', function (e) {

    lastInteract = performance.now();
  });
  brainCanvas.addEventListener('pointerup', function (e) {

    drag = null; setTimeout(function () { cam.autospin = 1; }, 4000);
  });
  brainCanvas.addEventListener('wheel', function (e) {
    e.preventDefault(); cam.dist = Math.max(120, Math.min(520, cam.dist * (1 + e.deltaY * 0.001))); lastInteract = performance.now();
  }, { passive: false });
  brainCanvas.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2) { pinch = null; return; }
    var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) cam.dist = Math.max(120, Math.min(520, cam.dist * pinch / d));
    pinch = d;
  }, { passive: true });

  function pick(x, y) {
    var best = -1, bd = 22 * 22, tmp = [0, 0, 0, 0];
    for (var i = 0; i < N; i++) {
      var P = project(pos[i * 3], pos[i * 3 + 1], pos[i * 3 + 2], tmp);
      var d = (P[0] - x) * (P[0] - x) + (P[1] - y) * (P[1] - y);
      if (d < bd) { bd = d; best = i; }
    }
    var info = $('info');
    if (best < 0) { info.style.display = 'none'; return; }
    var n = nodes[best]; n.glow = 1.6;
    info.textContent = '';
    var h3 = document.createElement('h3'); h3.textContent = n.label; info.appendChild(h3);
    var k = document.createElement('div'); k.className = 'k'; k.textContent = n.kind + ' · ' + adj[best].length + ' links'; info.appendChild(k);
    var l = document.createElement('div');
    l.textContent = adj[best].slice(0, 8).map(function (j) { return nodes[j].label; }).join(' · ');
    info.appendChild(l);

  // blob poke + satellite tap
  var poke = [0, 0, 1, 0], pokeT = -1e9, ripple = 0;
  $('blob').addEventListener('pointerdown', function (e) {

  // HUD
  $('b-listen').onclick = listen;
  $('b-act').onclick = function () { act('Home Assistant'); };
  $('ask').addEventListener('keydown', function (e) { if (e.key === 'Enter') { ask(this.value.trim()); this.value = ''; } });
  [['m-temper', 'temper'], ['m-vital', 'vital'], ['m-recov', 'recov'], ['m-streak', 'streak']].forEach(function (pair) {
    $(pair[0]).addEventListener('input', function () { mood[pair[1]] = parseFloat(this.value); lastInteract = performance.now(); });
  });
  $('b-check').onclick = function () {
    setTimeout(function () { showHud(false); }, 1800);       // let the blob react, then tuck the controls away
    ripple = 1; lastInteract = performance.now();
    var mid = byName['Mood']; nodes[mid].glow = 2;
    firePulse(mid, 0, 0, moodHue(mood.temper));
    if (!REAL.live) { history.shift(); history.push({ temper: mood.temper, note: 'just now (sample)' }); return; }
    fetch('/api/mood/checkin', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ recovery: mood.recov, vitality: mood.vital, temper: mood.temper }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { $('reply').textContent = j.ok ? 'Checked in. Mood ' + mood.temper.toFixed(1) + '.' : (j.error || 'Check-in failed'); })
      .catch(function () { $('reply').textContent = 'Beast OS did not answer.'; });
  };

  // ------------------------------------------------------------------
  // Frame loop: 60 fps active, 15 fps idle, paused when hidden
  // ------------------------------------------------------------------
  var lastFrame = 0, lastT = performance.now();
  function spring(key, target, dt) {
    var k = 26, damp = 7.5;
    var a = (target - moodNow[key]) * k - moodVel[key] * damp;
    moodVel[key] += a * dt; moodNow[key] += moodVel[key] * dt;
  }

    requestAnimationFrame(frame);
    if (document.hidden) return;
    var active = V.state !== 'idle' || now - lastInteract < 3000 || ripple > 0.01;
    var minGap = active ? 15 : 66;
    if (now - lastFrame < minGap) return;
    lastFrame = now;
    var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

    // Virgil state blending
    var tgtRing = V.state === 'listening' ? 1 : 0, tgtThink = V.state === 'thinking' ? 1 : 0;
    V.ring += (tgtRing - V.ring) * Math.min(1, dt * 6);
    V.think += (tgtThink - V.think) * Math.min(1, dt * 5);
    var lvl = V.state === 'listening' ? micLevel(now) : V.state === 'speaking' ? speechEnvelope(now) : 0;
    V.level += (lvl - V.level) * Math.min(1, dt * 18);
    V.speak = V.state === 'speaking' ? V.level : V.speak * 0.85;
    V.act = V.state === 'acting' ? Math.min(1, V.act + dt * 1.5) : Math.max(0, V.act - dt * 2);

    // mood springs

    spring('hue', tg.hue, dt); spring('wob', tg.wob, dt); spring('smooth', tg.smooth, dt); spring('size', tg.size, dt);
    applyAmbient();
    ripple = Math.max(0, ripple - dt * 0.6);
    var pt = (now - pokeT) / 1000;
    poke[3] = pt < 3 ? Math.exp(-pt * 2.6) * Math.cos(pt * 11) : 0;

    // pulses + node glow decay
    for (var p = pulses.length - 1; p >= 0; p--) {

  requestAnimationFrame(frame);
  var demo = (location.search.match(/demo=(\w+)/) || [])[1];
  if (demo === 'think') setTimeout(function () { ask('war room notes'); }, 300);
  if (demo === 'listen') setTimeout(listen, 300);
  if (demo === 'act') setTimeout(function () { act('Home Assistant'); }, 300);

  // other devices' check-ins arrive live
  if (window.EventSource && REAL.live) {
    var es = new EventSource('/api/events');
    es.onmessage = function (e) {
      var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (m.topic === 'mood.checkin') {
        var d = m.data;

}

// ---- boot: real data from the Beast OS kernel, sample fallback when opened standalone
(function () {
  function get(u) {
    return fetch(u, { credentials: 'same-origin' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  var done = false;
  function go(real) { if (done) return; done = true; beastVisuals(real); }
  setTimeout(function () { go({ live: false }); }, 2500);
  Promise.all([get('/api/modules'), get('/api/mood/history?days=30')])
    .then(function (r) { go({ live: true, modules: r[0].modules || [], mood: r[1] }); })
    .catch(function () { go({ live: false }); });
})();
