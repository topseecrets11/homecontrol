<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prompts</title>
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#2a2a2a;--ink:#d8e6d8;--dim:#7a857c;--acc:#32cd32}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'JetBrains Mono','DejaVu Sans Mono',monospace;padding:16px}
h1{font-size:13px;letter-spacing:.3em;color:var(--acc);margin:0 0 4px}p.sub{color:var(--dim);font-size:11px;margin:0 0 14px}
#q{width:100%;padding:9px 10px;font:inherit;font-size:12px;background:#111;border:1px solid var(--line);border-radius:8px;color:var(--ink);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.t{font-size:12px;color:var(--acc);letter-spacing:.06em}.tags{font-size:10px;color:var(--dim);margin-top:2px}
.txt{font-size:12px;line-height:1.55;margin:8px 0;white-space:pre-wrap;word-break:break-word}
button{font:inherit;font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#101010;color:var(--ink);cursor:pointer;margin-right:6px}
button:hover{border-color:var(--acc);color:var(--acc)}#toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--acc);min-height:1em}
</style></head><body>
<h1>PROMPTS</h1><p class="sub">Your addresses are filled in. Copy, or send straight to the <b>claude</b> tmux session on Beast.</p>
<input id="q" placeholder="Filter…" autocomplete="off">
<div id="list"></div><div id="toast"></div>
<script>
(function(){
  var all=[], list=document.getElementById('list'), toast=document.getElementById('toast');
  function say(m){toast.textContent=m;setTimeout(function(){toast.textContent=''},2600)}
  function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e}
  function draw(){
    var q=document.getElementById('q').value.toLowerCase(); list.textContent='';
    all.filter(function(p){return !q||(p.title+' '+p.rendered+' '+(p.tags||[]).join(' ')).toLowerCase().indexOf(q)>=0})
    .forEach(function(p){
      var c=el('div','card'); c.appendChild(el('div','t',p.title)); c.appendChild(el('div','tags',(p.tags||[]).join(' · ')));
      c.appendChild(el('div','txt',p.rendered));
      var cp=el('button',null,'Copy'); cp.onclick=function(){navigator.clipboard.writeText(p.rendered).then(function(){say('Copied')},function(){say('Copy blocked here; long-press the text')})};
      var sd=el('button',null,'Send to Claude'); sd.onclick=function(){
        fetch('/api/prompts/send',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:p.id})})
        .then(function(r){return r.json()}).then(function(j){say(j.ok?'Typed into the claude session. Press Enter there.':j.error)})};
      c.appendChild(cp); c.appendChild(sd); list.appendChild(c);
    });
  }
  document.getElementById('q').oninput=draw;
  fetch('/api/prompts',{credentials:'same-origin'}).then(function(r){return r.json()}).then(function(j){all=j.prompts||[];draw()});
})();
</script></body></html>
