<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="BEAST OS" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Orbitron:wght@400;600;700;900&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./homeos.css" />
    <title>BEAST OS</title>
    <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
</head>
<body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Portrait Orientation Lock Overlay -->
    <div id="portrait-lock" data-testid="portrait-lock">
        <p>ROTATE TO ACCESS COMMAND</p>
    </div>

    <!-- HOME OS Application -->
    <div id="homeos-app" style="transform:translateZ(0)">

        <!-- Sticky Header -->
        <header id="app-header" data-testid="app-header">
            <div class="hdr-left" data-testid="header-logo">BEAST OS</div>
            <div class="hdr-center" data-testid="mode-indicator">
                <span class="mode-dot" id="mode-dot"></span>
                <span id="mode-text">OPERATIONAL MODE</span>
            </div>
            <div class="hdr-right">
                <span id="live-clock" data-testid="live-clock"></span>
            </div>
        </header>

        <!-- Main Content Area -->
        <div id="main-area">
            <!-- Sidebar Navigation -->
            <nav id="sidebar" data-testid="sidebar-nav">
                <div id="nav-modules">
                    <button class="nav-btn active" data-module="ARENA" data-testid="nav-arena">
                        <span class="nav-dot"></span>
                        <div class="nav-text">
                            <span class="nav-title">THE ARENA</span>
                            <span class="nav-sub">Active</span>
                        </div>
                    </button>
                    <button class="nav-btn" data-module="NODE" data-testid="nav-node">
                        <span class="nav-dot"></span>
                        <div class="nav-text">
                            <span class="nav-title">THE NODE</span>
                            <span class="nav-sub"></span>
                        </div>
                    </button>
                    <button class="nav-btn" data-module="SANCTUM" data-testid="nav-sanctum">
                        <span class="nav-dot"></span>
                        <div class="nav-text">
                            <span class="nav-title">THE SANCTUM</span>
                            <span class="nav-sub"></span>
                        </div>
                    </button>
                    <button class="nav-btn" data-module="ORACLE" data-testid="nav-oracle">
                        <span class="nav-dot"></span>
                        <div class="nav-text">
                            <span class="nav-title">THE ORACLE</span>
                            <span class="nav-sub"></span>
                        </div>
                    </button>
                </div>
                <button id="settings-btn" data-testid="settings-button" title="Lockout Protocol Settings">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
            </nav>

            <!-- Module Viewport -->
            <div id="viewport" data-testid="module-viewport"></div>
        </div>

        <!-- AI Message Bar (VIRGIL) -->
        <footer id="ai-bar" data-testid="ai-message-bar">
            <span class="ai-prefix">VIRGIL:</span>
            <span id="virgil-msg" data-testid="virgil-message">Systems nominal.</span>
            <span class="ai-cursor"></span>
        </footer>
    </div>

    <script src="./blob.js"></script>
    <script src="./modes.js"></script>
    <script src="./demo.js"></script>
    <script src="./beastos.js"></script>
    <script src="./homeos.js"></script>
</body>
</html>
